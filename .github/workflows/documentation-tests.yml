name: Documentation tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  data-repository-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out umbrella repository
        uses: actions/checkout@v4
        with:
          path: the-swedish-parliament-corpus

      - name: Check out riksdagen-records
        uses: actions/checkout@v4
        with:
          repository: swerik-project/riksdagen-records
          path: riksdagen-records

      - name: Check out riksdagen-persons
        uses: actions/checkout@v4
        with:
          repository: swerik-project/riksdagen-persons
          path: riksdagen-persons

      - name: Check out riksdagen-motions
        uses: actions/checkout@v4
        with:
          repository: swerik-project/riksdagen-motions
          path: riksdagen-motions

      - name: Check out riksdagen-interpellations
        uses: actions/checkout@v4
        with:
          repository: swerik-project/riksdagen-interpellations
          path: riksdagen-interpellations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run documentation tests
        working-directory: the-swedish-parliament-corpus
        env:
          SWERIK_REQUIRE_DATA_REPOSITORIES: "1"
        run: python -m unittest test.documentatoin_tests
